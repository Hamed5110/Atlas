name: CI

on:
  push:
    branches: [main, master, hcm-airfare]
  pull_request:
    branches: [main, master, hcm-airfare]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy strict
        run: mypy --strict

  test-backend:
    name: Unit & integration tests
    needs: quality
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AIRFARE_ENVIRONMENT: test
      AIRFARE_DATABASE_URL: sqlite+pysqlite:///:memory:
      AIRFARE_JWT_SECRET: ci-test-jwt-secret-minimum-32-chars
      AIRFARE_BOOTSTRAP_ADMIN_PASSWORD: "StrongPassword!2026"
      AIRFARE_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --cov=airfare_management \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -m "not desktop and not e2e and not slow" \
            -q
      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-mutation:
    name: Mutation testing
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      AIRFARE_ENVIRONMENT: test
      AIRFARE_DATABASE_URL: sqlite+pysqlite:///:memory:
      AIRFARE_JWT_SECRET: ci-test-jwt-secret-minimum-32-chars
      AIRFARE_BOOTSTRAP_ADMIN_PASSWORD: "StrongPassword!2026"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,ml]"
      - name: Run mutmut
        run: mutmut run --timeout 300
      - name: Mutation results
        run: mutmut results

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit pip-audit detect-secrets
      - name: Bandit SAST
        run: bandit -r src/ -f json -o bandit-report.json || true
      - name: Dependency audit
        run: |
          pip freeze > requirements-ci.txt
          pip-audit -r requirements-ci.txt || true
      - name: Secret scan
        run: detect-secrets scan --all-files --baseline .secrets.baseline || true

  test-e2e:
    name: Playwright E2E
    needs: test-backend
    runs-on: ubuntu-latest
    env:
      CI: "true"
      AIRFARE_ENVIRONMENT: test
      AIRFARE_DATABASE_URL: sqlite+pysqlite:///./var/e2e.db
      AIRFARE_JWT_SECRET: ci-e2e-jwt-secret-minimum-32-chars!!
      AIRFARE_BOOTSTRAP_ADMIN_PASSWORD: "StrongPassword!2026"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Prepare SQLite database
        run: |
          mkdir -p var
          python -m alembic upgrade head
      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run E2E (functional / a11y / responsive; visuals skipped on Linux)
        working-directory: tests/e2e
        run: npx playwright test --reporter=list
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14

  test-load:
    name: Load test (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install load tools
        run: pip install -e ".[test]"
      - name: Locust headless
        run: |
          locust -f tests/load/locustfile.py --headless \
            -u 100 -r 10 --run-time 5m \
            --host http://127.0.0.1:3389 || true
