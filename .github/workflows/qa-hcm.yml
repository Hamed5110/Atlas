name: ATLAS HCM QA

on:
  push:
    branches: [main, master, "cursor/**"]
    paths:
      - "atlas-next/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/qa-hcm.yml"
  pull_request:
    paths:
      - "atlas-next/**"
      - "tests/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/qa-hcm.yml"
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run Playwright E2E + visual against live API"
        type: boolean
        default: true
      run_k6:
        description: "Run k6 load against AI agent endpoints"
        type: boolean
        default: true
      update_snapshots:
        description: "Update visual baselines (commit afterward)"
        type: boolean
        default: false

concurrency:
  group: qa-hcm-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_ROOT: ${{ github.workspace }}

jobs:
  frontend-static:
    name: Frontend source + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: atlas-next/package-lock.json

      - name: Install atlas-next deps
        working-directory: atlas-next
        run: npm ci

      - name: Typecheck
        working-directory: atlas-next
        run: npm run typecheck

      - name: Source contract tests
        working-directory: atlas-next
        run: node --test tests/*.mjs

  agentic-api:
    name: Agentic Data Agent API gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run agentic QA (live API)
        id: agentic
        env:
          ATLAS_E2E_BASE_URL: ${{ secrets.ATLAS_E2E_BASE_URL }}
          ATLAS_E2E_TOKEN: ${{ secrets.ATLAS_E2E_TOKEN }}
          ATLAS_E2E_USERNAME: ${{ secrets.ATLAS_E2E_USERNAME }}
          ATLAS_E2E_PASSWORD: ${{ secrets.ATLAS_E2E_PASSWORD }}
        run: |
          if [ -z "$ATLAS_E2E_BASE_URL" ]; then
            echo "Skipping agentic API — set repo secret ATLAS_E2E_BASE_URL to enable."
            exit 0
          fi
          if [ -z "$ATLAS_E2E_TOKEN" ] && [ -z "$ATLAS_E2E_PASSWORD" ]; then
            echo "Skipping agentic API — set ATLAS_E2E_TOKEN or ATLAS_E2E_PASSWORD."
            exit 0
          fi
          python tests/agentic_qa_runner.py

  e2e-visual:
    name: Playwright E2E + visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root deps (Playwright)
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Require live API secrets
        env:
          ATLAS_E2E_BASE_URL: ${{ secrets.ATLAS_E2E_BASE_URL }}
        run: |
          if [ -z "$ATLAS_E2E_BASE_URL" ]; then
            echo "::error::Set secret ATLAS_E2E_BASE_URL for E2E"
            exit 1
          fi

      - name: Seed auth from token
        env:
          ATLAS_E2E_TOKEN: ${{ secrets.ATLAS_E2E_TOKEN }}
        shell: bash
        run: |
          if [ -n "$ATLAS_E2E_TOKEN" ]; then
            mkdir -p tests/e2e
            python - <<'PY'
          import json, os
          from pathlib import Path
          Path("tests/e2e").mkdir(parents=True, exist_ok=True)
          Path("tests/e2e/.auth.json").write_text(
              json.dumps({"access_token": os.environ["ATLAS_E2E_TOKEN"], "token_type": "bearer"}),
              encoding="utf-8",
          )
          print("auth seed written")
          PY
          else
            echo "No token secret — password login will be used"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright chromium then visual (Option A)
        env:
          ATLAS_E2E_BASE_URL: ${{ secrets.ATLAS_E2E_BASE_URL }}
          ATLAS_E2E_USERNAME: ${{ secrets.ATLAS_E2E_USERNAME }}
          ATLAS_E2E_PASSWORD: ${{ secrets.ATLAS_E2E_PASSWORD }}
          CI: "true"
          REPO_ROOT: ${{ github.workspace }}
        run: |
          set +e
          npx playwright test --project=chromium
          chrom_rc=$?
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npx playwright test --project=visual --update-snapshots
          else
            npx playwright test --project=visual
          fi
          vis_rc=$?
          python tests/qa-agent/aggregate_playwright_results.py
          agg_rc=$?
          if [ $chrom_rc -ne 0 ] || [ $vis_rc -ne 0 ] || [ $agg_rc -ne 0 ]; then
            exit 1
          fi

      - name: QA Agent Stage 5 report
        if: always()
        env:
          REPO_ROOT: ${{ github.workspace }}
        run: python tests/qa-agent/orchestrate_post_run.py

      - name: Comment PR with QA Agent report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'test-reports/qa-agent/report.md';
            if (!fs.existsSync(path)) {
              core.warning('No Stage 5 report.md — skip PR comment');
              return;
            }
            const report = fs.readFileSync(path, 'utf8');
            const marker = '<!-- ATLAS-QA-AGENT-REPORT -->';
            const body = marker + '\n' + report;
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

      - name: Upload Playwright + QA Agent report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-reports/playwright/
            test-reports/qa-agent/
            test-results/
            tests/e2e/**/*-snapshots/
            tests/qa-agent/saa-scores.json
          if-no-files-found: ignore

  k6-agent:
    name: k6 AI agent load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_k6 }}
    steps:
      - uses: actions/checkout@v4

      - name: Require live API secrets
        env:
          ATLAS_E2E_BASE_URL: ${{ secrets.ATLAS_E2E_BASE_URL }}
        run: |
          if [ -z "$ATLAS_E2E_BASE_URL" ]; then
            echo "::error::Set secret ATLAS_E2E_BASE_URL for k6"
            exit 1
          fi

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run agent endpoint load
        env:
          ATLAS_E2E_BASE_URL: ${{ secrets.ATLAS_E2E_BASE_URL }}
          ATLAS_E2E_TOKEN: ${{ secrets.ATLAS_E2E_TOKEN }}
          ATLAS_E2E_USERNAME: ${{ secrets.ATLAS_E2E_USERNAME }}
          ATLAS_E2E_PASSWORD: ${{ secrets.ATLAS_E2E_PASSWORD }}
          ATLAS_K6_VUS: "5"
          ATLAS_K6_DURATION: "45s"
        run: k6 run tests/load/ai-agent-endpoints.k6.js
